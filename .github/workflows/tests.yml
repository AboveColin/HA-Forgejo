name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Link the integration into the test config
        run: |
          site="$(python -c 'import pytest_homeassistant_custom_component as p, os; print(os.path.dirname(p.__file__))')"
          ln -sfn "$PWD/custom_components/forgejo" \
            "$site/testing_config/custom_components/forgejo"

      - name: Run tests
        run: pytest -q --cov=custom_components.forgejo --cov-report=term-missing
